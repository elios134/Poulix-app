import java.util.Properties

apply plugin: 'com.android.application'

// --- SYSTÈME DE VERSIONING AUTOMATIQUE ---
def versionPropsFile = file('version.properties')
def Properties versionProps = new Properties()

if (versionPropsFile.exists()) {
    versionPropsFile.withInputStream { versionProps.load(it) }
} else {
    versionProps['APP_VERSION_CODE'] = "4"
    versionProps['APP_VERSION_NAME'] = "1.0.2"
}

// Priorité à la CI, sinon valeur du fichier local
def appVersionCode = (System.getenv("CI_BUILD_NUMBER") ?: versionProps['APP_VERSION_CODE']).toInteger()
def appVersionName = (project.findProperty('APP_VERSION_NAME') ?: versionProps['APP_VERSION_NAME']).toString()

android {
    namespace = "com.poulpix"
    compileSdk = rootProject.ext.compileSdkVersion
    
    defaultConfig {
        applicationId "com.poulpix"
        minSdk = rootProject.ext.minSdkVersion
        targetSdk = rootProject.ext.targetSdkVersion
        
        versionCode appVersionCode
        versionName appVersionName
        
        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
        
        aaptOptions {
            ignoreAssetsPattern = '!.svn:!.git:!.ds_store:!*.scc:.*:!CVS:!thumbs.db:!picasa.ini:!*~'
        }
    }

    buildTypes {
        debug {
            manifestPlaceholders = [
                ADMOB_APP_ID: project.findProperty('ADMOB_APP_ID_DEBUG') ?: "ca-app-pub-3940256099942544~3347511713"
            ]
        }
        release {
            manifestPlaceholders = [
                ADMOB_APP_ID: project.findProperty('ADMOB_APP_ID_RELEASE') ?: "ca-app-pub-3940256099942544~3347511713"
            ]
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android.txt'), 'proguard-rules.pro'
        }
    }

    // --- LOGIQUE D'INCRÉMENTATION POST-BUILD ---
    // --- LOGIQUE D'INCRÉMENTATION POST-BUILD ROBUSTE ---
    applicationVariants.all { variant ->
        if (variant.buildType.name == "release") {
            
            // 1. On crée une tâche dédiée
            def taskName = "increment${variant.name.capitalize()}VersionCode"
            def incrementTask = tasks.register(taskName) {
                doLast {
                    if (System.getenv("CI_BUILD_NUMBER") == null) {
                        // On relit le fichier pour s'assurer d'avoir la dernière valeur
                        def props = new Properties()
                        if (versionPropsFile.exists()) {
                            versionPropsFile.withInputStream { props.load(it) }
                            def currentCode = props['APP_VERSION_CODE'].toInteger()
                            def nextCode = currentCode + 1
                            props['APP_VERSION_CODE'] = nextCode.toString()
                            props.store(versionPropsFile.newWriter(), "Auto-incremented by Friday System")
                            println "================================================================"
                            println "SÉCURITÉ : Build réussi. VersionCode incrémenté à ${nextCode}"
                            println "================================================================"
                        }
                    }
                }
            }

            // 2. On attache cette tâche à la génération de l'APK
            variant.assembleProvider.configure {
                finalizedBy incrementTask
            }
            
            // 3. On attache aussi cette tâche à la génération de l'AAB (App Bundle)
            try {
                tasks.named("bundle${variant.name.capitalize()}").configure {
                    finalizedBy incrementTask
                }
            } catch (Exception e) {
                // Ignore si la tâche bundle n'est pas encore disponible
            }
        }
    }
}

repositories {
    flatDir {
        dirs '../capacitor-cordova-android-plugins/src/main/libs', 'libs'
    }
}

dependencies {
    implementation fileTree(include: ['*.jar'], dir: 'libs')
    implementation "androidx.appcompat:appcompat:$androidxAppCompatVersion"
    implementation "androidx.coordinatorlayout:coordinatorlayout:$androidxCoordinatorLayoutVersion"
    implementation "androidx.core:core-splashscreen:$coreSplashScreenVersion"
    implementation project(':capacitor-android')
    testImplementation "junit:junit:$junitVersion"
    androidTestImplementation "androidx.test.ext:junit:$androidxJunitVersion"
    androidTestImplementation "androidx.test.espresso:espresso-core:$androidxEspressoCoreVersion"
    implementation project(':capacitor-cordova-android-plugins')
}

apply from: 'capacitor.build.gradle'

try {
    def servicesJSON = file('google-services.json')
    if (servicesJSON.exists()) {
        apply plugin: 'com.google.gms.google-services'
    }
} catch(Exception e) {
    logger.info("google-services.json not found, google-services plugin not applied.")
}